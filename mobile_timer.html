<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cornerman — Round Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #0B0B0D;
    font-family: 'Inter', sans-serif;
    color: #F3F1EA;
  }

  .bx-num { font-family: 'Bebas Neue', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .bx-mono { font-family: 'JetBrains Mono', monospace; }

  .bx-app {
    min-height: 680px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    background: #0B0B0D;
    background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04), transparent 60%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
  }

  .bx-flashlayer {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }
  .bx-flashlayer.on {
    animation: bx-flash 0.5s ease-out forwards;
  }

  @keyframes bx-flash {
    0% { opacity: 0.15; }
    100% { opacity: 0; }
  }

  @keyframes bx-pulse {
    0% { box-shadow: 0 0 0 0 var(--pulse-color, rgba(230,57,70,0.4)); }
    70% { box-shadow: 0 0 0 14px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }
  .bx-current { animation: bx-pulse 1.4s ease-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .bx-current { animation: none; }
    .bx-flashlayer.on { animation: none; }
  }

  .bx-header {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .bx-eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    color: #6B6B70;
    font-weight: 600;
  }

  .bx-title {
    font-size: 26px;
    line-height: 1;
    margin-top: 2px;
  }

  .bx-icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #2A2A2F;
    background: transparent;
    color: #F3F1EA;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    padding: 0;
  }
  .bx-icon-btn:active { transform: scale(0.96); }
  .bx-icon-btn.active {
    background: #1E1E23;
    border-color: #38383E;
  }
  .bx-icon-btn:disabled { cursor: default; opacity: 0.45; }

  .bx-header-actions { display: flex; gap: 8px; }

  .bx-ticker {
    width: 100%;
    max-width: 420px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 26px;
  }

  .bx-tick {
    width: 22px;
    height: 9px;
    border-radius: 2px;
    background: transparent;
    border: 1px solid #333338;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .bx-tick.done { background: rgba(230,57,70,0.28); border: none; }
  .bx-tick.current { background: #E63946; border: none; }

  .bx-ring-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    margin-bottom: 22px;
  }

  .bx-ring-labels {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .bx-phase-label {
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 2px;
    transition: color 0.4s ease;
  }

  .bx-time {
    font-size: 68px;
    line-height: 1;
  }

  .bx-round-label {
    font-size: 12px;
    color: #6B6B70;
    margin-top: 6px;
  }

  .bx-progress-circle {
    transition: stroke-dashoffset 0.9s linear, stroke 0.4s ease;
  }

  .bx-controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .bx-start-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 16px 38px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    background: #F3F1EA;
    color: #0B0B0D;
    min-width: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.3s ease, transform 0.12s ease;
  }
  .bx-start-btn:active { transform: scale(0.97); }

  .bx-spacer { width: 48px; height: 48px; }

  .bx-settings-panel {
    width: 100%;
    max-width: 420px;
    margin-top: 28px;
    background: #141417;
    border: 1px solid #232327;
    border-radius: 14px;
    padding: 18px 18px 6px;
    display: none;
  }
  .bx-settings-panel.open { display: block; }

  .bx-settings-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .bx-settings-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: #8A8A8E;
  }

  .bx-hint {
    font-size: 12px;
    color: #8A8A8E;
    margin-bottom: 14px;
    background: #1B1B1F;
    padding: 8px 10px;
    border-radius: 8px;
    display: none;
  }
  .bx-hint.show { display: block; }

  .bx-setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #1E1E22;
  }
  .bx-setting-row.disabled { opacity: 0.45; }

  .bx-setting-label { font-size: 14px; font-weight: 500; }

  .bx-setting-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bx-setting-value {
    font-size: 13px;
    min-width: 58px;
    text-align: center;
  }

  .bx-step-btn {
    width: 28px;
    height: 28px;
  }
</style>
</head>
<body>

<div class="bx-app" id="bxApp">
  <div class="bx-flashlayer" id="bxFlash"></div>

  <div class="bx-header">
    <div>
      <div class="bx-eyebrow">CORNERMAN</div>
      <div class="bx-num bx-title">ROUND TIMER</div>
    </div>
    <div class="bx-header-actions">
      <button class="bx-icon-btn" id="bxSoundBtn" aria-label="Mute sound"></button>
      <button class="bx-icon-btn" id="bxSettingsBtn" aria-label="Settings"></button>
    </div>
  </div>

  <div class="bx-ticker" id="bxTicker"></div>

  <div class="bx-ring-wrap">
    <svg width="280" height="280" viewBox="0 0 200 200" style="transform: rotate(-90deg);">
      <circle cx="100" cy="100" r="90" fill="none" stroke="#1C1C20" stroke-width="10" />
      <circle cx="190" cy="100" r="3" fill="#2C2C31" />
      <circle cx="100" cy="190" r="3" fill="#2C2C31" />
      <circle cx="10" cy="100" r="3" fill="#2C2C31" />
      <circle cx="100" cy="10" r="3" fill="#2C2C31" />
      <circle class="bx-progress-circle" id="bxProgress" cx="100" cy="100" r="90" fill="none"
        stroke="#85858C" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="565.48" stroke-dashoffset="0" />
    </svg>
    <div class="bx-ring-labels">
      <div class="bx-mono bx-phase-label" id="bxPhaseLabel">READY</div>
      <div class="bx-num bx-time" id="bxTime">3:00</div>
      <div class="bx-mono bx-round-label" id="bxRoundLabel">ROUND 1 / 12</div>
    </div>
  </div>

  <div class="bx-controls">
    <button class="bx-icon-btn" id="bxResetBtn" aria-label="Reset" style="width:48px;height:48px;"></button>
    <button class="bx-start-btn" id="bxStartBtn"></button>
    <div class="bx-spacer"></div>
  </div>

  <div class="bx-settings-panel" id="bxSettingsPanel">
    <div class="bx-settings-head">
      <div class="bx-settings-title">SESSION SETTINGS</div>
      <button class="bx-icon-btn" id="bxCloseSettingsBtn" aria-label="Close settings" style="width:28px;height:28px;border:none;"></button>
    </div>
    <div class="bx-hint" id="bxHint">Reset the timer to edit settings mid-session.</div>
    <div id="bxSettingsRows"></div>
  </div>
</div>

<script>
(function () {
  var ICONS = {
    play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    reset: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
    settings: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    volumeOn: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
    volumeOff: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',
    close: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    minus: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    plus: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
  };

  var DEFAULTS = { rounds: 12, roundLength: 180, restLength: 60, prepLength: 10, warnAt: 10 };

  var PHASE_META = {
    idle: { label: 'READY', accent: '#85858C', glow: 'rgba(133,133,140,0.25)' },
    prep: { label: 'GET READY', accent: '#E8A33D', glow: 'rgba(232,163,61,0.35)' },
    work: { label: 'ROUND', accent: '#E63946', glow: 'rgba(230,57,70,0.4)' },
    rest: { label: 'REST', accent: '#3A86C8', glow: 'rgba(58,134,200,0.35)' },
    done: { label: 'DONE', accent: '#4CAF6D', glow: 'rgba(76,175,109,0.35)' }
  };

  var R = 90, C = 2 * Math.PI * R;

  var state = {
    settings: Object.assign({}, DEFAULTS),
    phase: 'idle',
    round: 1,
    timeLeft: 0,
    isRunning: false,
    soundOn: true,
    settingsOpen: false
  };

  var audioCtx = null;
  var warned = false;
  var tickHandle = null;

  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function strike(ctx, delay, long) {
    var now = ctx.currentTime + delay;
    var dur = long ? 2.3 : 1.4;
    var osc1 = ctx.createOscillator();
    var osc2 = ctx.createOscillator();
    var gain = ctx.createGain();
    osc1.type = 'triangle'; osc1.frequency.value = 740;
    osc2.type = 'sine'; osc2.frequency.value = 1480;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.5, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + dur + 0.05); osc2.stop(now + dur + 0.05);
  }

  function playBell(opts) {
    opts = opts || {};
    if (!state.soundOn) return;
    try {
      var ctx = ensureAudio();
      strike(ctx, 0, !!opts.long);
      if (opts.double) strike(ctx, 0.22, false);
    } catch (e) {}
  }

  function playClack() {
    if (!state.soundOn) return;
    try {
      var ctx = ensureAudio();
      [0, 0.14].forEach(function (delay) {
        var now = ctx.currentTime + delay;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.value = 1800;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.28, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.1);
      });
    } catch (e) {}
  }

  function fmt(sec) {
    var s = Math.max(0, Math.round(sec));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' + r : r);
  }

  function doFlash() {
    var el = document.getElementById('bxFlash');
    el.style.background = PHASE_META[state.phase].accent;
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
  }

  function totalForPhase() {
    if (state.phase === 'prep') return state.settings.prepLength;
    if (state.phase === 'work') return state.settings.roundLength;
    if (state.phase === 'rest') return state.settings.restLength;
    return 1;
  }

  function advancePhase() {
    warned = false;
    if (state.phase === 'prep') {
      state.phase = 'work';
      state.timeLeft = state.settings.roundLength;
      doFlash(); playBell({ double: true });
    } else if (state.phase === 'work') {
      if (state.round >= state.settings.rounds) {
        state.phase = 'done';
        state.isRunning = false;
        stopTicking();
        doFlash(); playBell({ long: true });
      } else {
        state.phase = 'rest';
        state.timeLeft = state.settings.restLength;
        doFlash(); playBell({});
      }
    } else if (state.phase === 'rest') {
      state.round += 1;
      state.phase = 'work';
      state.timeLeft = state.settings.roundLength;
      doFlash(); playBell({ double: true });
    }
  }

  function tick() {
    var next = state.timeLeft - 1;
    if (next > 0) {
      state.timeLeft = next;
      if ((state.phase === 'work' || state.phase === 'rest') &&
          state.settings.warnAt > 0 && next === state.settings.warnAt && !warned) {
        warned = true;
        playClack();
      }
    } else {
      state.timeLeft = 0;
      advancePhase();
    }
    render();
  }

  function startTicking() {
    stopTicking();
    tickHandle = setInterval(tick, 1000);
  }
  function stopTicking() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  function handleStart() {
    ensureAudio();
    if (state.phase === 'idle') {
      state.round = 1;
      warned = false;
      if (state.settings.prepLength > 0) {
        state.phase = 'prep';
        state.timeLeft = state.settings.prepLength;
      } else {
        state.phase = 'work';
        state.timeLeft = state.settings.roundLength;
      }
      state.isRunning = true;
      startTicking();
      doFlash(); playBell({});
    } else if (state.phase === 'done') {
      handleReset();
    } else if (state.isRunning) {
      state.isRunning = false;
      stopTicking();
    } else {
      state.isRunning = true;
      startTicking();
    }
    render();
  }

  function handleReset() {
    state.isRunning = false;
    stopTicking();
    state.phase = 'idle';
    state.round = 1;
    state.timeLeft = 0;
    warned = false;
    render();
  }

  function updateSetting(key, delta, min, max) {
    if (state.phase !== 'idle') return;
    state.settings[key] = Math.min(max, Math.max(min, state.settings[key] + delta));
    render();
  }

  var SETTING_DEFS = [
    { key: 'rounds', label: 'Rounds', delta: 1, min: 1, max: 30, fmt: function (v) { return String(v); } },
    { key: 'roundLength', label: 'Round length', delta: 15, min: 15, max: 1200, fmt: fmt },
    { key: 'restLength', label: 'Rest length', delta: 15, min: 0, max: 600, fmt: fmt },
    { key: 'prepLength', label: 'Get ready', delta: 5, min: 0, max: 60, fmt: fmt },
    { key: 'warnAt', label: 'Warning clack', delta: 5, min: 0, max: 30, fmt: function (v) { return v > 0 ? v + 's left' : 'Off'; } }
  ];

  function buildSettingsRows() {
    var container = document.getElementById('bxSettingsRows');
    container.innerHTML = '';
    SETTING_DEFS.forEach(function (def) {
      var row = document.createElement('div');
      row.className = 'bx-setting-row';
      row.id = 'bxRow_' + def.key;

      var label = document.createElement('span');
      label.className = 'bx-setting-label';
      label.textContent = def.label;

      var controls = document.createElement('div');
      controls.className = 'bx-setting-controls';

      var minusBtn = document.createElement('button');
      minusBtn.className = 'bx-icon-btn bx-step-btn';
      minusBtn.innerHTML = ICONS.minus;
      minusBtn.setAttribute('aria-label', 'Decrease ' + def.label);
      minusBtn.onclick = function () { updateSetting(def.key, -def.delta, def.min, def.max); };

      var value = document.createElement('span');
      value.className = 'bx-mono bx-setting-value';
      value.id = 'bxVal_' + def.key;

      var plusBtn = document.createElement('button');
      plusBtn.className = 'bx-icon-btn bx-step-btn';
      plusBtn.innerHTML = ICONS.plus;
      plusBtn.setAttribute('aria-label', 'Increase ' + def.label);
      plusBtn.onclick = function () { updateSetting(def.key, def.delta, def.min, def.max); };

      controls.appendChild(minusBtn);
      controls.appendChild(value);
      controls.appendChild(plusBtn);
      row.appendChild(label);
      row.appendChild(controls);
      container.appendChild(row);
    });
  }

  function buildTicker() {
    var wrap = document.getElementById('bxTicker');
    wrap.innerHTML = '';
    for (var i = 0; i < state.settings.rounds; i++) {
      var el = document.createElement('div');
      el.className = 'bx-tick';
      el.id = 'bxTick_' + i;
      wrap.appendChild(el);
    }
  }

  function render() {
    var meta = PHASE_META[state.phase];

    document.getElementById('bxSoundBtn').innerHTML = state.soundOn ? ICONS.volumeOn : ICONS.volumeOff;
    document.getElementById('bxSoundBtn').setAttribute('aria-label', state.soundOn ? 'Mute sound' : 'Unmute sound');

    var settingsBtn = document.getElementById('bxSettingsBtn');
    settingsBtn.innerHTML = ICONS.settings;
    settingsBtn.classList.toggle('active', state.settingsOpen);

    document.getElementById('bxResetBtn').innerHTML = ICONS.reset;

    var startBtn = document.getElementById('bxStartBtn');
    var startLabel = state.phase === 'idle' ? 'START'
      : state.phase === 'done' ? 'NEW SESSION'
      : state.isRunning ? 'PAUSE' : 'RESUME';
    startBtn.innerHTML = (state.isRunning ? ICONS.pause : ICONS.play) + '<span>' + startLabel + '</span>';
    startBtn.style.background = state.isRunning ? meta.accent : '#F3F1EA';

    if (document.getElementById('bxTicker').children.length !== state.settings.rounds) {
      buildTicker();
    }
    for (var i = 0; i < state.settings.rounds; i++) {
      var rn = i + 1;
      var tickEl = document.getElementById('bxTick_' + i);
      if (!tickEl) continue;
      var isCurrent = rn === state.round && (state.phase === 'work' || (state.phase === 'prep' && rn === 1));
      var isDone = rn < state.round || state.phase === 'done';
      tickEl.classList.toggle('current', isCurrent && state.phase === 'work');
      tickEl.classList.toggle('done', isDone);
      tickEl.style.setProperty('--pulse-color', meta.glow);
    }

    document.getElementById('bxPhaseLabel').textContent = meta.label;
    document.getElementById('bxPhaseLabel').style.color = meta.accent;
    document.getElementById('bxTime').textContent = state.phase === 'idle' ? fmt(state.settings.roundLength) : fmt(state.timeLeft);
    document.getElementById('bxRoundLabel').textContent = state.phase === 'done'
      ? (state.settings.rounds + ' ROUNDS COMPLETE')
      : ('ROUND ' + state.round + ' / ' + state.settings.rounds);

    var total = totalForPhase();
    var fraction = total > 0 ? state.timeLeft / total : (state.phase === 'done' ? 1 : 0);
    var dash = state.phase === 'idle' ? C : C * (1 - Math.max(0, Math.min(1, fraction)));
    var progress = document.getElementById('bxProgress');
    progress.setAttribute('stroke-dashoffset', dash);
    progress.setAttribute('stroke', meta.accent);

    document.getElementById('bxSettingsPanel').classList.toggle('open', state.settingsOpen);
    document.getElementById('bxHint').classList.toggle('show', state.phase !== 'idle');

    SETTING_DEFS.forEach(function (def) {
      var valEl = document.getElementById('bxVal_' + def.key);
      if (valEl) valEl.textContent = def.fmt(state.settings[def.key]);
      var rowEl = document.getElementById('bxRow_' + def.key);
      if (rowEl) {
        rowEl.classList.toggle('disabled', state.phase !== 'idle');
        var btns = rowEl.querySelectorAll('button');
        btns.forEach(function (b) { b.disabled = state.phase !== 'idle'; });
      }
    });
  }

  document.getElementById('bxStartBtn').onclick = handleStart;
  document.getElementById('bxResetBtn').onclick = handleReset;
  document.getElementById('bxSoundBtn').onclick = function () { state.soundOn = !state.soundOn; render(); };
  document.getElementById('bxSettingsBtn').onclick = function () { state.settingsOpen = !state.settingsOpen; render(); };
  document.getElementById('bxCloseSettingsBtn').innerHTML = ICONS.close;
  document.getElementById('bxCloseSettingsBtn').onclick = function () { state.settingsOpen = false; render(); };

  buildTicker();
  buildSettingsRows();
  render();
})();
</script>

</body>
</html>
